[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "tmp",
    "/receipts",
    "logs",
    ".pytest_cache",
]

[tool.ruff.lint]
# Строгий набор правил: ошибки, предупреждения, баги, импорты
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",  # Длина строк (допускается для длинных HTML-шаблонов и регулярных выражений)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Экспорт модулей через __init__.py
"database/__init__.py" = ["F401"]
"templates/__init__.py" = ["F401"]
"services/__init__.py" = ["F401"]
"tests/*" = ["B011", "E701", "E702", "F841"]  # Специфика синтаксиса тестов


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--basetemp=.pytest_tmp"

[tool.coverage.run]
source = ["services", "database", "templates", "server", "app", "bot", "worker", "config"]
omit = [
    "tests/*",
    "benchmarks/*",
    "scratch/*",
    "scripts/*",
    "generate_*.py",
    "polish_*.py",
    "apply_*.py",
    "append_*.py",
    "inspect_*.py",
    "upgrade_*.py",
    "update_*.py",
    "check_*.py",
    "run_tests.py",
    "test_parse_tarifs.py",
    "encrypt_env.py",
    "set_password.py",
    "import_data.py",
    "grpc_client.py",
    "proto/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true


