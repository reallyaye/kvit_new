services:
  # ────────────────────── 1. PostgreSQL (Internal Production DB) ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kvit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kvit_db}
      POSTGRES_USER: ${POSTGRES_USER:?Обязательно укажите POSTGRES_USER в файле .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Обязательно укажите надежный POSTGRES_PASSWORD в файле .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kvit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-kvit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ────────────────────── 2. Redis (Internal Queue & Distributed Locks) ─────────────
  redis:
    image: redis:7-alpine
    container_name: kvit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks:
      - kvit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ────────────────────── 3. Kvit-API (Scalable Web & gRPC Microservice) ────────────
  kvit-api:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name намеренно опущен для поддержки horizontal auto-scaling: docker compose up --scale kvit-api=3
    restart: unless-stopped
    command: ["python", "app.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      - APP_ENV=production
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kvit_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - RUN_EMBEDDED_WORKER=false
      - ENABLE_X_ACCEL_REDIRECT=true
      - X_ACCEL_PREFIX=/internal_receipts/
      - RECEIPTS_DIR=/app/receipts
      - LOG_FILE=/app/logs/api.log
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?Обязательно укажите SECRET_KEY в .env}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?Обязательно укажите ADMIN_PASSWORD_HASH в .env}
      - GRPC_API_KEY=${GRPC_API_KEY:?Обязательно укажите GRPC_API_KEY в .env}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS:-}
      - TRUST_PROXY=true
    volumes:
      - ./data:/app/data
      - kvit-receipts:/app/receipts
      - kvit-logs:/app/logs
    networks:
      - kvit-network
    expose:
      - "8000"
      - "50051"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ────────────────────── 4. Kvit-Worker (Dedicated Async PDF & OCR Worker) ───────────
  kvit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py", "--workers", "${WORKER_COUNT:-4}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kvit_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - RECEIPTS_DIR=/app/receipts
      - LOG_FILE=/app/logs/worker.log
      - LOG_LEVEL=INFO
      - WORKER_COUNT=${WORKER_COUNT:-4}
      - MAX_OCR_CONCURRENT_WORKERS=${MAX_OCR_CONCURRENT_WORKERS:-2}
      - SECRET_KEY=${SECRET_KEY:?Обязательно укажите SECRET_KEY в .env}
    volumes:
      - ./data:/app/data
      - kvit-receipts:/app/receipts
      - kvit-logs:/app/logs
    networks:
      - kvit-network

  # ────────────────────── 5. Nginx (Public Reverse Proxy & Scale Balancer) ───────────
  nginx:
    image: nginx:1.25-alpine
    container_name: kvit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - kvit-api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - kvit-receipts:/app/receipts:ro
      - kvit-logs:/var/log/nginx
    networks:
      - kvit-network

networks:
  kvit-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kvit-receipts:
  kvit-logs:
