[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "tmp",
    "receipts",
    "logs",
    ".pytest_cache",
]

[tool.ruff.lint]
# Строгий набор правил: ошибки, предупреждения, баги, импорты
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",  # Длина строк (допускается для длинных HTML-шаблонов и регулярных выражений)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Экспорт модулей через __init__.py
"database/__init__.py" = ["F401"]
"templates/__init__.py" = ["F401"]
"services/__init__.py" = ["F401"]
"tests/*" = ["B011", "E701"]  # Специфика синтаксиса тестов


[tool.bandit]
exclude_dirs = ["tests", "tmp", "receipts", "logs", ".pytest_cache"]
skips = [
    "B101",  # Использование assert в тестах
    "B104",  # Привязка к 0.0.0.0 (для контейнеров/gRPC)
    "B108",  # Использование /tmp
]
