name: Enterprise CI/CD & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Static Analysis, Security Scans & Dependency Audit
  # ─────────────────────────────────────────────────────────────
  lint-and-security:
    name: Lint, Static Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'kvit_test/requirements.txt'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --only-binary :all: pip==25.0.1
          pip install --only-binary :all: ruff==0.9.7 bandit==1.8.2 pip-audit==2.8.0
          if [[ -f kvit_test/requirements.txt ]]; then pip install --only-binary :all: -r kvit_test/requirements.txt; fi

      - name: Run Ruff Linter & Formatter Check
        run: |
          cd kvit_test && ruff check .

      - name: Run Bandit SAST Security Scanner
        run: |
          cd kvit_test && bandit -r . -x ./tests,./tmp,./scratch,./receipts,./benchmarks -ll -ii

      - name: Run pip-audit (Vulnerability Scan of Dependency Graph)
        run: |
          pip-audit -r kvit_test/requirements.txt

  # ─────────────────────────────────────────────────────────────
  # Job 2: Multi-Version Test Matrix, Migrations & Coverage Threshold
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test Suite & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-security]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'kvit_test/requirements.txt'

      - name: Install System Dependencies (Tesseract OCR & Language Packs)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          python -m pip install --only-binary :all: pip==25.0.1
          if [[ -f kvit_test/requirements.txt ]]; then pip install --only-binary :all: -r kvit_test/requirements.txt; fi
          pip install --only-binary :all: pytest==8.3.4 pytest-cov==6.0.0

      - name: Run Full Unit & Integration Test Suite
        env:
          GRPC_API_KEY: "ci_test_secret_api_key_for_github_actions_32"
          ADMIN_PASSWORD_HASH: "pbkdf2_sha256$600000$966d916ee43dd2278a427101739ae460$2a2ad4dfee16755de4a4f89fe598abcd881f6627ebd7a5fb3f57685dd5704340"
          SECRET_KEY: "ci_secret_signing_key_for_testing_2026"
        run: |
          cd kvit_test
          python run_tests.py
          pytest -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload Test Coverage Artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-report-py311
          path: kvit_test/coverage.xml

  # ─────────────────────────────────────────────────────────────
  # Job 3: Concurrency & Migration Smoke Test
  # ─────────────────────────────────────────────────────────────
  load-and-migration-smoke:
    name: Concurrency & Migration Verification
    runs-on: ubuntu-latest
    needs: [lint-and-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'kvit_test/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --only-binary :all: pip==25.0.1
          if [[ -f kvit_test/requirements.txt ]]; then pip install --only-binary :all: -r kvit_test/requirements.txt; fi

      - name: Verify Clean Database Migration Fail-Fast
        run: |
          cd kvit_test
          python -c "from database import migrate_db; migrate_db(); print('Migration OK')"

  # ─────────────────────────────────────────────────────────────
  # Job 4: Docker Build & Blocking Trivy Container Vulnerability Scan
  # ─────────────────────────────────────────────────────────────
  docker-build-and-scan:
    name: Docker Build & Blocking Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./kvit_test
          file: ./kvit_test/Dockerfile
          load: true
          tags: kvit-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Container Vulnerability Scanner (Blocking Security Gate)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: 'kvit-app:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
