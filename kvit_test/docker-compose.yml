version: '3.8'

services:
  # ────────────────────── 1. PostgreSQL (Production Database) ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kvit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kvit_db}
      POSTGRES_USER: ${POSTGRES_USER:-kvit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kvit_secure_password_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kvit_user} -d ${POSTGRES_DB:-kvit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ────────────────────── 2. Redis (Distributed Queue & Locks) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: kvit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ────────────────────── 3. Kvit-API (Web & gRPC Microservice) ──────────────────────
  kvit-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kvit-api
    restart: unless-stopped
    command: ["python", "app.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      - APP_ENV=production
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kvit_user}:${POSTGRES_PASSWORD:-kvit_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-kvit_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - RUN_EMBEDDED_WORKER=false
      - ENABLE_X_ACCEL_REDIRECT=true
      - X_ACCEL_PREFIX=/internal_receipts/
      - RECEIPTS_DIR=/app/receipts
      - LOG_FILE=/app/logs/api.log
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH environment variable is required}
      - GRPC_API_KEY=${GRPC_API_KEY:?GRPC_API_KEY environment variable is required}
      - TRUST_PROXY=true
    volumes:
      - kvit-data:/app/data
      - kvit-receipts:/app/receipts
      - kvit-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ────────────────────── 4. Kvit-Worker (Dedicated PDF & OCR Worker) ──────────────────────
  kvit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kvit-worker
    restart: unless-stopped
    command: ["python", "worker.py", "--workers", "${WORKER_COUNT:-4}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kvit_user}:${POSTGRES_PASSWORD:-kvit_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-kvit_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - RECEIPTS_DIR=/app/receipts
      - LOG_FILE=/app/logs/worker.log
      - LOG_LEVEL=INFO
      - WORKER_COUNT=${WORKER_COUNT:-4}
      - MAX_OCR_CONCURRENT_WORKERS=${MAX_OCR_CONCURRENT_WORKERS:-2}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
    volumes:
      - kvit-data:/app/data
      - kvit-receipts:/app/receipts
      - kvit-logs:/app/logs

  # ────────────────────── 5. Nginx (Reverse Proxy & X-Accel-Redirect) ──────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: kvit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "50051:50051" # gRPC проксирование при необходимости
    depends_on:
      - kvit-api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - kvit-receipts:/app/receipts:ro
      - ./static:/app/static:ro
      - kvit-logs:/var/log/nginx

volumes:
  postgres-data:
  redis-data:
  kvit-data:
  kvit-receipts:
  kvit-logs:
