# ============================================================
# Nginx — конфиг прокси для интеграции сайта квитанций КРЭК
# ============================================================
#
# Как использовать:
# 1. Скопируйте этот файл в /etc/nginx/sites-available/krec
# 2. Выполните: sudo ln -s /etc/nginx/sites-available/krec /etc/nginx/sites-enabled/krec
# 3. Замените "your-domain.kz" на ваш реальный домен
# 4. Убедитесь что Python-сервис квитанций запущен на порту 8000:
#    cd /path/to/kvit_test && python app.py
# 5. sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name your-domain.kz www.your-domain.kz;

    # ── Заголовки безопасности (Security Headers) ───────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Автоперенаправление на HTTPS (если используете SSL)
    # return 301 https://$server_name$request_uri;

    # ── PHP-сайт КРЭК (основной) ──────────────────────────────
    root /var/www/html/krec;   # <-- укажите путь к папке krec
    index index.php index.html;
    charset utf-8;

    # ── Защита служебных директорий и скрытых файлов ───────────
    # Запрет доступа к скрытым файлам (.git, .env и т.д.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Запрет прямого доступа к служебным каталогам
    location ~ ^/(data|_archive|includes)/ {
        deny all;
        return 404;
    }

    # Запрет доступа к чувствительным расширениям файлов
    location ~* \.(sql|sqlite|sqlite3|env|bak|log|conf|ini|sh|py)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # <-- ваша версия PHP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── Квитанции (Python-сервис на порту 8000) ───────────────
    # Доступны по адресу: http://your-domain.kz/kvit/
    location /kvit/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        # WebSocket поддержка (для квитанций обязательно)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача реального IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для длинных операций (загрузка PDF)
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;

        # Размер загружаемых файлов (100 МБ)
        client_max_body_size 100M;
    }

    # WebSocket для квитанций
    location /ws {
        proxy_pass         http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Статика PHP-сайта
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|pdf|zip|xls|xlsx|doc|docx)$ {
        expires 7d;
        add_header Cache-Control "public";
        # Дублируем security headers для статики
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

