# Nginx Enterprise Production Configuration for Kvit-App
# Multi-replica API load balancing + TLS/HTTPS termination + WebSocket + Static + X-Accel PDF

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Встроенный Docker DNS resolver для динамического обнаружения реплик API (--scale kvit-api=N)
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # ─── HTTP Сервер (Reverse Proxy, Static, WebSocket, X-Accel PDF) ───
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 100M;
        client_body_buffer_size 128k;

        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Поддержка автоматического получения сертификатов Let's Encrypt / Certbot при необходимости
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # ─── Внутренняя защищенная отдача PDF по X-Accel-Redirect ───
        location /internal_receipts/ {
            internal;
            alias /app/receipts/;
            add_header Content-Type application/pdf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # ─── Статические файлы (CSS, JS, Fonts, Images) ───
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ─── Публичные документы и файлы ───
        location /files/ {
            alias /app/static/files/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ─── WebSocket шлюз реального времени ───
        location /ws/ {
            set $upstream_api "http://kvit-api:8000";
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── Основной HTTP API (балансировка к kvit-api) ───
        location / {
            set $upstream_api "http://kvit-api:8000";
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
