# ==============================================================================
# Nginx Конфигурация для портала ТОО «КРЭК» и сервиса квитанций
# Стек: Python (Threading HTTPServer / gRPC / WebSockets) + Nginx Reverse Proxy
# ==============================================================================

upstream kvit_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name krec.kz www.krec.kz;

    # Максимальный размер загрузки для реестров и PDF (100 MB)
    client_max_body_size 100M;

    # Корневой каталог статики
    root /var/www/kvit_test/static;
    index index.html;

    # 1. Заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 2. Блокировка доступа к скрытым и служебным файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 3. Раздача статических файлов (CSS, JS, изображения, PDF, favicon, robots, sitemap)
    location ~* ^/(css|images|files)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri @python_proxy;
    }

    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        expires 1d;
        access_log off;
        try_files $uri @python_proxy;
    }

    # 4. WebSocket проксирование (/ws)
    location /ws {
        proxy_pass http://kvit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. Главный прокси на Python-приложение
    location / {
        try_files $uri @python_proxy;
    }

    location @python_proxy {
        proxy_pass http://kvit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Буферизация и таймауты
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
