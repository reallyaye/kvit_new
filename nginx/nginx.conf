user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 500m;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    upstream kvit_backend {
        server kvit-api:8000;
        keepalive 32;
    }

    # Перенаправление всех HTTP запросов на HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;

        server_name krec.kz;

        # Перенаправление при случайном обращении по HTTP на SSL порт (400 Bad Request -> HTTPS)
        error_page 497 =301 https://$host$request_uri;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Заголовки безопасности (управляются централизованно в nginx)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.net https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.net; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.net; frame-ancestors 'self';" always;

        location /static/ {
            alias /app/static/;
            access_log off;
            expires 7d;
        }

        location /internal_receipts/ {
            internal;
            alias /app/receipts/;
        }

        error_page 503 @maintenance;
        location @maintenance {
            root /app;
            rewrite ^(.*)$ /static/maintenance.html break;
        }

        location / {
            # Проверка флага технических работ
            if (-f /app/data/maintenance.flag) {
                return 503;
            }

            proxy_pass http://kvit_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Скрытие идентификатора бэкенд-контейнера и исключение дублирования заголовков
            proxy_hide_header X-Backend-Instance;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
