# Nginx Enterprise Production Configuration for Kvit-App
# Multi-replica API load balancing + TLS/HTTPS termination + WebSocket + Static + X-Accel PDF

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Встроенный Docker DNS resolver для динамического обнаружения реплик API (--scale kvit-api=N)
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # ─── 1. HTTP Сервер (Редирект на HTTPS + ACME Challenge) ───
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Поддержка автоматического получения сертификатов Let's Encrypt / Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Если SSL-сертификаты пока не подключены (тестовый/локальный режим),
        # раскомментируйте или используйте fallback на API, иначе перенаправляем на HTTPS:
        location / {
            # При наличии внешнего SSL или включенном HTTPS:
            # return 301 https://$host$request_uri;

            # Локальный/HTTP режим по умолчанию:
            set $upstream_api "http://kvit-api:8000";
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Статика по HTTP
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Внутренняя отдача PDF по X-Accel-Redirect
        location /internal_receipts/ {
            internal;
            alias /app/receipts/;
            add_header Content-Type application/pdf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }
    }

    # ─── 2. HTTPS Сервер (Production TLS Termination) ───
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        client_max_body_size 100M;
        client_body_buffer_size 128k;

        # Пути к сертификатам (монтируются через volume /etc/letsencrypt или /etc/nginx/ssl)
        ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

        # Безопасные протоколы и шифры (Mozilla Modern Configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Заголовки безопасности
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ─── Защищенный внутренний каталог квитанций (X-Accel-Redirect) ───
        location /internal_receipts/ {
            internal;
            alias /app/receipts/;
            add_header Content-Type application/pdf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # ─── Статические файлы (CSS, JS, Fonts, Images) ───
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ─── WebSocket шлюз реального времени ───
        location /ws/ {
            set $upstream_api "http://kvit-api:8000";
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── Основной HTTP API (балансировка между репликами kvit-api) ───
        location / {
            set $upstream_api "http://kvit-api:8000";
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
